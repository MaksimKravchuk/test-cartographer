name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Fast checks: types, the demo model, unit and component tests — on every OS.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm tc validate
      - run: pnpm test:unit
      - run: pnpm test:component

  # Engine API, CLI, MCP and scripted agents against the demo shop (needs a browser) — on every OS.
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:integration

  # The web GUI served by the engine, in a browser, on Windows and macOS
  # (Linux runs it in e2e below, with the Electron shell and the full run).
  gui:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @tc/desktop build
      - run: pnpm exec playwright test -c tests/e2e/playwright.config.ts gui.spec.ts pipeline.spec.ts

  # The self-built macOS app (package:mac) still packages, launches like a first start and runs its bundled demo shop.
  app-mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No browser installed here: the app downloads it on first launch.
      - run: pnpm --filter @tc/desktop package:mac
      - run: node apps/desktop/scripts/smoke.mjs "apps/desktop/release/mac-arm64/Test Cartographer.app/Contents/MacOS/Test Cartographer"
      - uses: actions/upload-artifact@v4
        with:
          name: test-cartographer-mac
          path: apps/desktop/release/*.dmg
          retention-days: 14

  # The GUI in a browser, the Electron shell, and a full test run against the demo shop.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: xvfb-run -a pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
