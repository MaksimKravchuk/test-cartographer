id: order
title: Order
description: A customer's order in the shop
key: id
reader:
  tool: vendure.get_order
  args:
    id: "{{key}}"
variants:
  - id: any
    title: Any order
    status: confirmed
  - id: card
    title: Оплата картой (заморозка, ручное списание)
    status: rejected
    provenance:
      source: agent
      agent: onboarding
      proposal: 2026-10-04-05-55-12-onboarding-order
      evidence:
        - e1
      sources:
        - jira
  - id: prepaid_card
