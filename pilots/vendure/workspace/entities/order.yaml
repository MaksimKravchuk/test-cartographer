transitions:
  - id: settle-authorized-payment
    title: Settle the authorized payment
    from: payment-authorized
    to: payment-settled
    action: settle-payment
    by:
      - manager
    effects:
      - description: Payment becomes Settled
        field: paymentState
        equals: Settled
    status: confirmed
    provenance:
      source: agent
      agent: manager-explorer
      proposal: 2026-10-04-06-05-21-manager-explorer
      evidence:
        - e2
        - e4
      sources: []
  - id: ship-settled-order
    title: Mark the fulfillment shipped
    from: payment-settled
    to: shipped
    action: mark-shipped
    by:
      - manager
    guards:
      - A Pending fulfillment covering all items exists
    effects:
      - description: Fulfillment becomes Shipped
        field: fulfillmentStates
        equals:
          - Shipped
    status: confirmed
    provenance:
      source: agent
      agent: manager-explorer
      proposal: 2026-10-04-06-05-21-manager-explorer
      evidence:
        - e7
        - e8
      sources: []
  - id: deliver-shipped-order
    title: Mark the fulfillment delivered
    from: shipped
    to: delivered
    action: mark-delivered
    by:
      - manager
    effects:
      - description: Fulfillment becomes Delivered
        field: fulfillmentStates
        equals:
          - Delivered
    status: confirmed
    provenance:
      source: agent
      agent: manager-explorer
      proposal: 2026-10-04-06-05-21-manager-explorer
      evidence:
        - e8
        - e9
        - e31
      sources: []
  - id: refund-cancel-delivered-order
    title: Refund and cancel a delivered order
    from: delivered
    to: cancelled
    action: refund-and-cancel
    by:
      - manager
    guards:
      - A refund/cancellation reason is required
      - All items must be selected for refund for the order to become Cancelled
    effects:
      - description: Line quantities become 0 and the order total becomes 0
        field: totalWithTax
        equals: 0
      - description: A refund is created in Pending state (Settle refund button shown);
          paymentState stays Settled
    status: confirmed
    provenance:
      source: agent
      agent: manager-explorer
      proposal: 2026-10-04-06-05-21-manager-explorer
      evidence:
        - e16
        - e17
        - e18
        - e19
      sources: []
  - id: cancel-authorized-order
    title: Cancel an authorized (unsettled) order
    from: payment-authorized
    to: cancelled
    action: cancel-order
    by:
      - manager
    guards:
      - A cancellation reason is required
      - Cancel entire order is selected
    effects:
      - description: Line quantities become 0 and the order total becomes 0
        field: totalWithTax
        equals: 0
    status: confirmed
    provenance:
      source: agent
      agent: manager-explorer
      proposal: 2026-10-04-06-05-21-manager-explorer
      evidence:
        - e28
        - e29
      sources: []
  - id: start-modifying-authorized-order
    title: Start modifying an authorized order
    from: payment-authorized
    to: modifying
    action: start-modification
    by:
      - manager
    status: confirmed
    provenance:
      source: agent
      agent: manager-explorer
      proposal: 2026-10-04-06-05-21-manager-explorer
      evidence:
        - e23
        - e24
        - e25
      sources: []
  - id: cancel-modification-to-authorized
    title: Cancel the modification (back to Payment authorized)
    from: modifying
    to: payment-authorized
    action: cancel-modification
    by:
      - manager
    guards:
      - Returns to the state the order was in before modification
    status: confirmed
    provenance:
      source: agent
      agent: manager-explorer
      proposal: 2026-10-04-06-05-21-manager-explorer
      evidence:
        - e25
        - e26
        - e27
      sources: []
  - id: buyer-starts-cart
    title: Buyer adds first item, creating the active order
    from: "@new"
    to: adding-items
    action: add-to-cart
    by:
      - buyer
    effects:
      - description: Order is active and not placed
        field: active
        equals: true
    status: confirmed
    provenance:
      source: agent
      agent: buyer-explorer
      proposal: 2026-10-04-06-05-27-buyer-explorer
      evidence:
        - e26
        - e19
      sources: []
  - id: buyer-proceeds-to-payment
    title: Buyer sets shipping address/method and proceeds to payment
    from: adding-items
    to: arranging-payment
    action: proceed-to-payment
    by:
      - buyer
    guards:
      - Shipping address and shipping method must be set (otherwise 'Cannot
        transition Order from AddingItems to ArrangingPayment')
    status: confirmed
    provenance:
      source: agent
      agent: buyer-explorer
      proposal: 2026-10-04-06-05-27-buyer-explorer
      evidence:
        - e5
        - e8
        - e18
      sources: []
  - id: buyer-pays-order
    title: Buyer pays with a storefront payment method
    from: arranging-payment
    to: payment-authorized
    action: pay-order
    by:
      - buyer
    effects:
      - description: Order becomes placed
        field: placed
        equals: true
      - description: Payment authorized
        field: paymentState
        equals: Authorized
    status: confirmed
    provenance:
      source: agent
      agent: buyer-explorer
      proposal: 2026-10-04-06-05-27-buyer-explorer
      evidence:
        - e7
        - e3
        - e16
      sources: []
  - id: pay_card
    title: Покупатель оплачивает картой — деньги замораживаются
    from: awaiting_payment
    to: payment_authorized
    action: pay
    by:
      - buyer
    effects:
      - description: Деньги заморожены на карте, не списаны
    status: rejected
    provenance:
      source: agent
      agent: onboarding
      proposal: 2026-10-04-05-55-12-onboarding-order
      evidence:
        - e3
        - e1
      sources:
        - jira
  - id: pay_prepaid
    title: Покупатель оплачивает предоплаченной картой — деньги списываются сразу
    from: awaiting_payment
    to: paid
    action: pay
    by:
      - buyer
    effects:
      - description: Деньги списаны сразу при оплате
    status: rejected
    provenance:
      source: agent
      agent: onboarding
      proposal: 2026-10-04-05-55-12-onboarding-order
      evidence:
        - e2
      sources:
        - jira
  - id: settle
    title: Менеджер вручную списывает замороженные деньги
    from: payment_authorized
    to: paid
    action: settle
    by:
      - manager
    effects:
      - description: Замороженные деньги списаны
    status: rejected
    provenance:
      source: agent
      agent: onboarding
      proposal: 2026-10-04-05-55-12-onboarding-order
      evidence:
        - e1
        - e8
      sources:
        - jira
        - qa-stand
  - id: ship
    title: Менеджер отгружает оплаченный заказ
    from: paid
    to: shipped
    action: ship
    by:
      - manager
    guards:
      - Заказ оплачен
    status: rejected
    provenance:
      source: agent
      agent: onboarding
      proposal: 2026-10-04-05-55-12-onboarding-order
      evidence:
        - e4
        - e5
      sources:
        - qa-stand
        - jira
  - id: deliver
    title: Менеджер отмечает доставку
    from: shipped
    to: delivered
    action: deliver
    by:
      - manager
    status: rejected
    provenance:
      source: agent
      agent: onboarding
      proposal: 2026-10-04-05-55-12-onboarding-order
      evidence:
        - e5
      sources:
        - jira
  - id: cancel_awaiting_payment
    title: Менеджер отменяет заказ на шаге оплаты
    from: awaiting_payment
    to: cancelled
    action: cancel
    by:
      - manager
    status: rejected
    provenance:
      source: agent
      agent: onboarding
      proposal: 2026-10-04-05-55-12-onboarding-order
      evidence:
        - e7
        - e6
      sources:
        - jira
        - qa-stand
  - id: cancel_authorized
    title: Менеджер отменяет заказ с замороженной оплатой
    from: payment_authorized
    to: cancelled
    action: cancel
    by:
      - manager
    status: rejected
    provenance:
      source: agent
      agent: onboarding
      proposal: 2026-10-04-05-55-12-onboarding-order
      evidence:
        - e7
        - e6
      sources:
        - jira
        - qa-stand
  - id: cancel_paid
    title: Менеджер отменяет оплаченный, но не отгруженный заказ
    from: paid
    to: cancelled
    action: cancel
    by:
      - manager
    status: rejected
    provenance:
      source: agent
      agent: onboarding
      proposal: 2026-10-04-05-55-12-onboarding-order
      evidence:
        - e7
        - e6
      sources:
        - jira
        - qa-stand
permits:
  - id: fulfill-settled-order
    title: Create a fulfillment for a settled order
    action: create-fulfillment
    by:
      - manager
    states:
      - payment-settled
    effects:
      - description: A fulfillment is created in Pending; the order state is unchanged
