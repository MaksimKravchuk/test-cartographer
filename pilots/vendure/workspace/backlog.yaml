stories:
  - id: shop_101
    title: Оплата заказа картой
    text: Покупатель оплачивает заказ на шаге оплаты. По карте деньги сначала
      замораживаются, списывает менеджер вручную в админке.
    acceptance:
      - Покупатель оплачивает заказ картой на шаге оплаты — деньги
        замораживаются (заказ в состоянии «оплата авторизована»)
      - Менеджер в админке вручную списывает замороженные деньги — заказ
        переходит в «Оплачен»
      - Списать оплату может только менеджер заказов
    feature: order_payment
    epic: orders
    key: SHOP-101
    trackerStatus: Done
    covers:
      - transition:order.buyer-pays-order
      - transition:order.settle-authorized-payment
    status: confirmed
    provenance:
      source: agent
      agent: onboarding
      proposal: 2026-10-04-05-55-12-onboarding
      evidence:
        - e21
      sources:
        - jira
  - id: shop_102
    title: Предоплаченная карта как способ оплаты
    text: Деньги списываются сразу при оплате.
    acceptance:
      - Покупатель оплачивает заказ предоплаченной картой — деньги списываются
        сразу, заказ сразу в «Оплачен» без ручного списания
    feature: order_payment
    epic: orders
    key: SHOP-102
    trackerStatus: Done
    covers: []
    status: confirmed
    provenance:
      source: agent
      agent: onboarding
      proposal: 2026-10-04-05-55-12-onboarding
      evidence:
        - e22
      sources:
        - jira
  - id: shop_110
    title: Отгрузка заказа
    text: Менеджер создаёт отправление, отмечает что отправлено, потом что
      доставлено.
    acceptance:
      - Менеджер создаёт отправление и отмечает его отправленным — заказ в
        «Отправлен»
      - Менеджер отмечает доставку — заказ в «Доставлен»
      - Отгрузить можно только оплаченный заказ
    feature: order_shipping
    epic: orders
    key: SHOP-110
    trackerStatus: Done
    covers:
      - permit:order.fulfill-settled-order
      - transition:order.ship-settled-order
      - transition:order.deliver-shipped-order
    status: confirmed
    provenance:
      source: agent
      agent: onboarding
      proposal: 2026-10-04-05-55-12-onboarding
      evidence:
        - e23
      sources:
        - jira
  - id: shop_120
    title: Отмена заказа менеджером
    text: Менеджер может отменить заказ до отгрузки. После отгрузки только через
      возврат.
    acceptance:
      - Менеджер отменяет заказ до отгрузки — заказ в «Отменён»
      - После отгрузки отменить заказ нельзя (только через возврат)
    feature: order_cancellation
    epic: orders
    key: SHOP-120
    trackerStatus: Done
    covers:
      - transition:order.cancel-authorized-order
      - transition:order.refund-cancel-delivered-order
    status: confirmed
    provenance:
      source: agent
      agent: onboarding
      proposal: 2026-10-04-05-55-12-onboarding
      evidence:
        - e24
      sources:
        - jira
  - id: shop_121
    title: Покупатель отменяет заказ из личного кабинета
    text: Пока нет, покупатель пишет в поддержку.
    acceptance:
      - Покупатель может отменить свой заказ из личного кабинета (не реализовано)
    feature: order_cancellation
    epic: orders
    key: SHOP-121
    trackerStatus: To Do
    covers: []
    status: confirmed
    provenance:
      source: agent
      agent: onboarding
