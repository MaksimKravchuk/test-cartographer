      sources:
        - jira
  - id: shop_130
    title: Роль поддержки
    text: Только просмотр заказов и клиентов.
    acceptance:
      - Поддержка видит заказы в админке
      - Поддержка не может менять заказы (оплата, отгрузка, отмена ей недоступны)
