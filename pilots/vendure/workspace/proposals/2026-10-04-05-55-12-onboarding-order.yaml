findings:
  - kind: contradiction
    note: "Wiki: after payment the order sits in status «Оплачен». SHOP-101: for card payments money is only frozen first and the manager settles it manually. So for card orders there is an intermediate 'authorized' state before «Оплачен». Modelled per Jira (payment_authorized → settle → paid); please confirm what status the UI shows for a card order before settlement."
    refs:
      - state:order.paid
      - state:order.payment_authorized
      - transition:order.settle
    evidence:
      - e4
      - e1
  - kind: question
    note: "Where are states awaiting_payment, payment_authorized, shipped, delivered, cancelled observable (status label in admin/storefront, or the vendure.get_order 'state' field)? Only «Оплачен» is named by a source. Also confirm the paid match field: the wiki names a UI status «Оплачен», but the reader is vendure.get_order, whose field/value may differ."
    refs:
      - state:order.awaiting_payment
      - state:order.payment_authorized
      - state:order.shipped
      - state:order.delivered
      - state:order.cancelled
      - state:order.paid
    evidence:
      - e3
      - e5
      - e4
  - kind: question
    note: "'Cancel only before shipment' — does that include orders still at the payment step and partially shipped orders (SHOP-112)? Cancellation from awaiting_payment is proposed by extension; partial shipment is not modelled. Also: on cancelling a card order with frozen money, is the hold released / is a paid order refunded automatically?"
    refs:
      - transition:order.cancel_awaiting_payment
      - transition:order.cancel_paid
    evidence:
      - e6
      - e13
  - kind: contradiction
    note: "Support role: wiki says support changes nothing and only views orders, yet the same page says support does refunds when a customer complains. SHOP-130 says view-only. Only a view permit is proposed for support."
    refs:
      - permit:order.view_by_support
    evidence:
      - e9
      - e14
      - e10
  - kind: question
    note: Catalog manager 'doesn't go into orders' — should we add a negative check that the catalog role cannot view/modify orders? No permit given to catalog.
    evidence:
      - e11
  - kind: gap
    note: "SHOP-121: buyer self-cancel isn't implemented yet ('пока нет'); no buyer cancel transition proposed."
    evidence:
      - e15
  - kind: gap
    note: SHOP-140 order drafts are Done but undescribed — no draft state or create-draft action proposed.
    evidence:
      - e16
  - kind: question
    note: Card payment on the stand is fake and accepts any data — declined/failed payment paths can't be exercised on this stand. Is there a way to simulate a declined card?
    refs:
      - transition:order.pay_card
    evidence:
      - e17
