baseRevision: 03860b80ef9f
rationale: "I read both sources: the stand wiki and the SHOP Jira export. Roles, interfaces and the order entity already existed and match the wiki (URLs and accounts), so no project-level role or interface changes are needed. I propose an order lifecycle: payment step → (card: authorized → manager settles) / (prepaid: paid immediately) → shipped → delivered, with manager cancellation before shipment. There are view permits for the manager and for support, rules for settle, ship and cancel, and three journeys. The backlog has the 3 Jira epics, 4 features sliced by order actions, and the Jira stories plus the SHOP-112 task, each mapped to the elements it covers. Unmapped items (buyer cancel, drafts, partial shipment, RMA, the cart bug) are reported as gaps. Conflicts are reported as contradictions instead of being resolved silently: «Оплачен» vs card authorization, and support refunds vs support being view-only."
