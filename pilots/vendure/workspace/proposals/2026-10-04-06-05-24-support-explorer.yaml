findings:
  - kind: question
    note: "The back office shows Support write controls on an order: Settle payment, an enabled Fulfill order (on Payment settled), Cancel order or items, Manually transition to state, Add note, Mark as Delivered, plus Modify order and Assign customer (these two I didn't try). The server rejects every write I tried with 'not currently authorized' and signs the Support user out. Should these controls be hidden or disabled for Support (a UI bug)? Or was Support meant to have some of these rights, e.g. adding notes for customer care?"
    refs:
      - support
      - view-order
    evidence:
      - e4
      - e5
      - e8
      - e12
      - e16
      - e19
      - e23
      - e32
  - kind: gap
    note: I didn't open detail pages as Support for Arranging payment, Delivered, Partially shipped or Partially delivered orders, so the read permit leaves out arranging-payment and delivered. Partially shipped and Partially delivered (listed by the setup tool) have no states proposed. The manual-transition dialog also lists Modifying and Arranging additional payment, which aren't modelled. Read access in these states is probably the same as elsewhere, but I haven't confirmed it.
    refs:
      - support-views-order
    evidence:
      - e14
      - e27
      - e29
  - kind: question
    note: A forbidden action ends the whole Support session (it redirects to login and says the session may have expired) instead of showing an inline permission error. Is this intended?
    evidence:
      - e5
      - e8
      - e12
