rationale: "I explored as Support in the admin back office, using orders created with vendure.create_order in every main state (and checked each one with read()). Support can open the orders list and order details. That includes lines, totals, tax, history, customer, shipping address, payments and fulfilments. Every write I tried was rejected by the server with \"not currently authorized\", and each rejection signed Support out. The order state never changed (checked with read() after each attempt). Rejected actions: settlePayment (e5), addNoteToOrder (e8), cancelOrder (e12), transitionOrderToState (e16), addFulfillmentToOrder (e23) and transitionFulfillmentToState / Mark as Delivered (e32). So for Support the only thing I'm proposing is a read permit. I'm also adding the order states (matched on the `state` field from read()) so the permit and later work can refer to them. The model is closed-world, so I'm not proposing the denied writes. The UI still shows these controls to Support, so I'm raising that as a question."
