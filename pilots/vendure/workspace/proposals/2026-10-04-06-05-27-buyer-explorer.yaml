rationale: "I explored the Storefront as the buyer. Building a cart (add to cart, change quantity, remove a line) works and was observed. The Payment step shows two dummy payment methods, but the Shipping step renders no address or shipping-method form. Paying therefore fails with \"Cannot transition Order from AddingItems to ArrangingPayment\" (e8), so I couldn't complete checkout end-to-end in the UI. The setup tool creates orders for a guest customer (it ignores a customer argument), so I couldn't pay a prepared order as the buyer either. I took the state list from the setup tool's enum and verified every state with read() (e3, e18–e25); the buyer's order history shows the same states (e2). After placing an order, the buyer can view it in Order history and on the confirmation page (only their own: another customer's order code never loads, e15). The per-order \"Actions\" button is labelled \"Not implemented\" and does nothing (e17), so the buyer has no cancel or return action."
