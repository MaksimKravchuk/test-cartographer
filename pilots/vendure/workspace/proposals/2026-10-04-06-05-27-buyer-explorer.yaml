findings:
  - kind: question
    note: Checkout is blocked in the Storefront. /checkout shows the Shipping/Payment/Confirmation steps and the order summary, but no address selector, shipping-method selector or 'proceed' button, even though the buyer has a default Shipping & Billing address. Clicking 'Pay with Standard Payment' on /checkout/payment returns 400 'Cannot transition Order from "AddingItems" to "ArrangingPayment"'. So I could not observe buyer-proceeds-to-payment and buyer-pays-order end-to-end. They are inferred from the payment buttons, the error, and placed orders in the buyer's history (Payment authorized, $5.00 shipping). Is the shipping step broken, or is shipping set some other way?
    refs:
      - buyer-proceeds-to-payment
      - buyer-pays-order
    evidence:
      - e5
      - e6
      - e12
      - e7
      - e8
      - e10
      - e16
  - kind: question
    note: The storefront has two payment methods ('Standard Payment' and 'Prepaid card'). Seeded and prepared orders with standard-payment end in PaymentAuthorized, but I couldn't confirm what Prepaid card produces (it might settle immediately, going straight to PaymentSettled).
    refs:
      - buyer-pays-order
    evidence:
      - e7
      - e3
  - kind: gap
    note: After an order is placed, the buyer has no actions on it in the Storefront. Each order in Order history has an 'Actions for this order (Not implemented)' button that does nothing; 'Track package' and 'Detailed overview' are display-only. The buyer can't cancel or request a return, so cancelling is presumably done by admin roles.
    evidence:
      - e17
      - e2
  - kind: question
    note: The buyer sees only their own placed orders. Opening the confirmation page with another customer's order code just shows 'Please wait while we process your order...' and never shows the order. The view-order permit should be limited to the order's owner; the model has no ownership rule or relation for this yet.
    refs:
      - buyer-views-placed-order
    evidence:
      - e15
      - e16
  - kind: question
    note: A Cancelled order keeps paymentState 'Authorized' while its line quantities and totals drop to 0. Is the authorized payment supposed to be voided or refunded on cancellation?
    refs:
      - cancelled
    evidence:
      - e21
  - kind: gap
    note: I didn't observe who moves orders between payment-authorized, payment-settled, (partially) shipped, (partially) delivered and cancelled. The buyer has no storefront control for any of these, so they are presumably admin (manager/support) transitions and should be explored from the admin-ui interface.
    evidence:
      - e2
      - e20
      - e22
      - e23
      - e24
      - e25
  - kind: question
    note: The vendure.create_order setup tool ignores a 'customer' argument and always creates orders for a generated guest customer. So prepared orders can't be used to test buyer-owned flows such as paying a prepared ArrangingPayment order.
    evidence:
      - e18
