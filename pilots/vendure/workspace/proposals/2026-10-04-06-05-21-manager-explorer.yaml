id: 2026-10-04-06-05-21-manager-explorer
entity: order
agent: manager-explorer
role: manager
createdAt: 2026-10-04T06:07:41.326Z
baseRevision: 03860b80ef9f
rationale: 'The model had no states or transitions. As the order manager, I followed one order through the full back-office path (order 61): PaymentAuthorized → settle payment → PaymentSettled → create fulfillment (state unchanged, fulfillment Pending) → mark as shipped → Shipped → mark as delivered → Delivered → refund & cancel → Cancelled. On a second order (64), I used a manual transition to move PaymentAuthorized → Modifying, then cancel modification brought it back to PaymentAuthorized. Then "Cancel order or items" moved it to Cancelled. Cancelled offers no target states. A manual Delivered → Cancelled transition was offered in the menu but rejected by the server. States are matched on the `state` field returned by vendure.get_order.'
