findings:
  - kind: question
    note: "On a Delivered order, the manual transition dialog offers only 'Cancelled', but the server rejects it: 'Cannot transition Order to the \"Cancelled\" state unless all OrderItems are cancelled'. The order stayed Delivered. The UI offers an option that is guaranteed to fail; cancelling only works through 'Refund & cancel order'. Is this rule (Cancelled requires all items cancelled) intended, and should the UI hide the option?"
    refs:
      - delivered
      - cancelled
    evidence:
      - e11
      - e13
      - e14
      - e15
  - kind: question
    note: After 'Cancel entire order' on a PaymentAuthorized order, the order is Cancelled but the read model still reports paymentState=Authorized. The authorization appears not to be voided or cancelled. Is that intended?
    refs:
      - cancel-authorized-order
    evidence:
      - e29
  - kind: question
    note: After 'Refund & cancel' on a Delivered order, the order is Cancelled, but paymentState stays Settled, the refund is Pending (with a 'Settle refund' button), and the fulfillment stays Delivered. Settling the refund was not explored and may be a separate step for the manager.
    refs:
      - refund-cancel-delivered-order
    evidence:
      - e18
      - e19
  - kind: gap
    note: "Cancelled appears to be terminal: no 'Refund & cancel' or 'Cancel' entries, and the manual transition dialog lists no target states."
    refs:
      - cancelled
    evidence:
      - e19
      - e20
  - kind: gap
    note: "Not explored because the run ran out of budget: the manual transitions PaymentAuthorized → 'Payment settled', → 'Arranging additional payment', and → 'Cancelled' (offered in e23); 'Modify order' from the menu, and completing a modification; cancel/refund from PaymentSettled and Shipped (Shipped shows 'Mark as Delivered', e31; its menu was not opened); Draft, AddingItems and ArrangingPayment orders; partial cancellation ('Cancel specified items'), which might lead to a partial state."
    refs:
      - payment-authorized
      - payment-settled
      - shipped
    evidence:
      - e3
      - e23
      - e28
      - e31
  - kind: question
    note: "'Fulfill order' is disabled while payment is only Authorized and becomes enabled after settlement. Settled payment looks like a precondition for fulfillment."
    refs:
      - fulfill-settled-order
    evidence:
      - e2
      - e5
