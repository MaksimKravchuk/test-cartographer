rationale: "I explored the Order back office (Vendure Admin v3.7.3) as manager \"Olga Manager\". I created orders in AddingItems, ArrangingPayment, PaymentAuthorized, Shipped, PartiallyShipped, Draft and Cancelled, then followed them into PaymentSettled, Delivered and PartiallyDelivered. Every order was checked with read(). I propose the 10 order states, keyed on the read() field `state`. I propose transitions only where the manager actually completed the action and read() showed the new state: Settle payment (PaymentAuthorized → PaymentSettled) and Mark as Delivered (Shipped → Delivered, PartiallyShipped → PartiallyDelivered). Settling a payment on a Cancelled order also worked and left the order Cancelled, so I propose it as a permit and raise a question. Actions I could see but not finish, because the form fields or the menu button have no accessible label (Fulfill order, Add payment, Complete draft, the order's menu button), are reported as findings, not transitions."
