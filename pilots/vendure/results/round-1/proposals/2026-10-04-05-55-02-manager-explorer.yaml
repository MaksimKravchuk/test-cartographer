findings:
  - kind: question
    note: "The Order manager could settle a $27.79 authorized payment on a Cancelled order whose total is $0.00. The UI showed 'Settle payment', the payment became Settled and the order stayed Cancelled. This captures money for a cancelled order and looks like a bug: you would expect the payment to be cancelled or voided instead. Should settling be allowed in Cancelled?"
    refs:
      - settle-payment-on-cancelled
    evidence:
      - e29
      - e30
      - e31
      - e32
  - kind: gap
    note: "'Fulfill order' is enabled in PaymentSettled and PartiallyDelivered (and disabled in PaymentAuthorized, Shipped, Delivered, AddingItems, ArrangingPayment and Cancelled). Its dialog's 'Create fulfillment' did nothing: the Method and Tracking code textboxes have no accessible labels and could not be filled, the order state did not change, and no error was shown. So the expected transitions PaymentSettled → Shipped/PartiallyShipped (and the fulfillment step from PartiallyDelivered) are unconfirmed. Adding labels or test ids to that dialog would make this testable."
    refs:
      - payment-settled
      - partially-delivered
    evidence:
      - e6
      - e7
      - e8
      - e9
      - e10
      - e20
      - e21
  - kind: gap
    note: In ArrangingPayment the manager sees 'Add payment to order ($27.79)'. The dialog's Payment method combobox has no label, so 'Add payment' stayed disabled. The expected ArrangingPayment → PaymentAuthorized/PaymentSettled transition is unconfirmed.
    refs:
      - arranging-payment
    evidence:
      - e22
      - e23
      - e24
  - kind: gap
    note: Draft orders show 'Complete draft' (disabled until customer, addresses and shipping method are set) plus Set customer / Set billing address / Set shipping address / Set shipping method / Set coupon codes. The customer combobox and the address fields have no labels, so the draft could not be completed. The Draft → ArrangingPayment (complete draft) transition is unconfirmed.
    refs:
      - draft
    evidence:
      - e25
      - e26
      - e27
      - e28
  - kind: gap
    note: Every order detail page has a button with no accessible name next to 'Fulfill order' (in Vendure this menu normally holds Cancel order / Modify order / Refund). It could not be opened, so cancellation and modification actions by the manager were not explored in any state.
    evidence:
      - e3
      - e14
      - e18
      - e30
      - e34
  - kind: question
    note: In AddingItems and Delivered the manager had no state-changing actions available apart from the unreachable menu. Notes ('Add note') and 'Assign order to another customer' exist in all states, but these were not exercised.
    refs:
      - adding-items
      - delivered
    evidence:
      - e34
      - e16
