findings:
  - kind: question
    note: The checkout cannot be completed in the storefront. On the Shipping step (/checkout) there is no address form, saved-address selector or shipping-method selector, only the order summary. The buyer does have a default address (Test Buyer, Berlin). Both 'Pay with Standard Payment' and 'Pay with Prepaid card' on /checkout/payment fail with 400 'Cannot transition Order from AddingItems to ArrangingPayment', and the order stays in AddingItems. Is the missing shipping form a bug? Because of this, the transitions ArrangingPayment -> PaymentAuthorized/PaymentSettled could not be observed for the buyer. The buyer's history does contain PaymentAuthorized and PaymentSettled orders, and a prepared settled order has paymentMethod 'standard-payment'.
    refs:
      - buyer-proceed-to-payment
      - pay-order
    evidence:
      - e6
      - e9
      - e18
      - e12
      - e10
      - e11
      - e22
      - e23
      - e13
      - e25
  - kind: question
    note: The 'pay-order' action is used for the AddingItems -> ArrangingPayment step because the storefront's pay buttons attempt that transition first. The step that adds the payment (ArrangingPayment -> PaymentAuthorized or PaymentSettled, which depends on the payment method) is not modelled because it could not be observed. A person should confirm whether Standard Payment settles immediately and whether Prepaid card only authorizes.
    refs:
      - pay-order
    evidence:
      - e10
      - e13
      - e25
  - kind: question
    note: "After an order is placed, the buyer can only read it: purchase history with 'Detailed overview' totals, and /checkout/confirmation/<code>. The 'Actions for this order (Not implemented)' button does nothing, so the buyer cannot cancel or return an order. 'Track package' appears on shipped and delivered orders. Should the buyer have post-purchase actions (cancel, return)?"
    refs:
      - buyer-view-own-order
    evidence:
      - e13
      - e14
      - e15
      - e27
  - kind: question
    note: The order is created implicitly by the first 'Add to cart'; the active order 45 belongs to buyer@shop.test. Because there is no 'initial' state, creation is modelled as a permit in adding-items rather than a transition. A cart quantity selector exists but could not be operated with the tools (a <select> cannot be filled).
    refs:
      - add-to-cart
      - buyer-add-to-cart
    evidence:
      - e4
      - e5
      - e16
      - e17
  - kind: question
    note: "Access control checked: when the buyer opens the confirmation page of another customer's (guest) placed order by its code, the order is not shown, only 'Please wait while we process your order...'."
    refs:
      - buyer-view-own-order
    evidence:
      - e25
      - e26
