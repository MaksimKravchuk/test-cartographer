rationale: "As the buyer (Anna Buyer, buyer@shop.test) in the storefront: adding a product to the cart creates or fills the buyer's active order (id 45, state AddingItems). The buyer can remove a cart line and the order stays in AddingItems. Checkout has three steps (Shipping, Payment, Confirmation). The Shipping step shows no address or shipping-method form. The Payment page offers \"Pay with Standard Payment\" and \"Pay with Prepaid card\", but both fail with \"Cannot transition Order from AddingItems to ArrangingPayment\", and the order stays unchanged. So paying could not be completed in the UI. After an order is placed, the buyer can only view it: purchase history (status, lines, \"Detailed overview\" totals) and the confirmation page by code. \"Actions for this order\" is marked Not implemented. The buyer cannot see another customer's order by its code. States are matched on the `state` field returned by read()."
