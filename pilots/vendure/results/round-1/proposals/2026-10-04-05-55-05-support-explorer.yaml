rationale: 'As the support role I explored two order states in the Admin UI: PaymentSettled (order 44) and PaymentAuthorized (order 47). In both states support can open the order detail page and see the lines, totals, tax summary, history, customer, shipping address and payment. In PaymentAuthorized the UI shows a "Settle payment" button to support. Clicking it gave "You are not authorized to access settlePayment" and logged the session out. After that, exploring the other states (Shipped, Delivered, Cancelled and the rest) was impossible: the login form fields have no labels or test ids I could fill. In PaymentSettled, "Fulfill order" opens a dialog, but "Create fulfillment" changed nothing (the order stayed PaymentSettled with no fulfillments). I propose the two observed states and a read permit for support. Everything else goes in as findings.'
