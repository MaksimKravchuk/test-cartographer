findings:
  - kind: question
    note: In PaymentAuthorized the back office shows support an enabled 'Settle payment' button. Clicking it is rejected on the server ('You are not authorized to access "settlePayment"'), and the admin UI then logs the user out. The order stays PaymentAuthorized with payment Authorized. Support does not have the settle-payment permission, which matches the closed-world model, but the UI offers an action the role can't perform, and the error kills the session. Should the button be hidden for support?
    refs:
      - payment-authorized
    evidence:
      - e8
      - e9
      - e10
      - e11
  - kind: question
    note: "In PaymentSettled the 'Fulfill order' button is enabled for support and opens the fulfillment dialog. Clicking 'Create fulfillment' twice, with Method and Tracking code left empty, did nothing visible: no toast, the dialog stayed open, and the order stayed PaymentSettled with fulfillmentStates []. The inputs couldn't be filled because they have no accessible labels. It's not confirmed whether support may create fulfillments (a PaymentSettled -> Shipped/PartiallyShipped transition). Someone needs to check with filled fields or with the role's permissions."
    refs:
      - payment-settled
    evidence:
      - e3
      - e4
      - e5
      - e6
  - kind: gap
    note: "In PaymentAuthorized, 'Fulfill order' is disabled for support. Support also sees 'Add note' (disabled until text is entered) and 'Assign order to another customer' in both states. I didn't exercise these: the note textbox has no label, and the session was lost. States not explored: AddingItems, ArrangingPayment, PartiallyShipped, Shipped, PartiallyDelivered, Delivered, Cancelled, Draft. After the forbidden settlePayment call the session was logged out, and the login form inputs (Username/Password) have no label or test id the tool can fill, so I couldn't log back in."
    refs:
      - payment-authorized
      - payment-settled
    evidence:
      - e2
      - e8
      - e12
