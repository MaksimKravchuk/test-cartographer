findings:
  - kind: gap
    note: SHOP-121 (buyer cancels from personal account) is To Do — no buyer cancel transition exists, so the story has empty covers. Today the buyer writes to support, but support can't change orders; presumably the manager cancels on their behalf — please confirm.
    refs:
      - story:shop_121
    evidence:
      - e25
      - e32
  - kind: gap
    note: "SHOP-140 'Черновики заказов' is Done but has no description: who creates drafts (manager in admin?), how a draft becomes a real order, and what status it shows. No draft state/action proposed yet; story covers left empty."
    refs:
      - story:shop_140
    evidence:
      - e27
  - kind: gap
    note: SHOP-112 'Частичная отгрузка' is a Done task with no description. The model has no partially-shipped state; need to know how a partial shipment looks and whether cancel is still allowed after it.
    refs:
      - story:shop_112
    evidence:
      - e29
  - kind: gap
    note: SHOP-150 Returns (RMA) is in Backlog, yet SHOP-120 says that after shipping cancellation is 'only through a return'. No refund/return action is modelled; story covers empty.
    refs:
      - story:shop_150
    evidence:
      - e28
      - e24
  - kind: gap
    note: SHOP-151 (cart sometimes disappears after login) is about the cart/session, not the order model; no cart entity exists. Not added as a story — decide whether to model a cart entity.
    evidence:
      - e30
  - kind: contradiction
    note: Wiki says support does refunds when a customer complains, but the same wiki says support changes nothing, SHOP-130 says support is view-only, and returns (SHOP-150) are still Backlog. No refund permit for support proposed.
    refs:
      - story:shop_130
      - story:shop_150
    evidence:
      - e31
      - e32
      - e26
      - e28
  - kind: question
    note: The stand wiki is marked 'updated long ago' — please confirm accounts, URLs and the status flow are still current (e.g. the 'Оплачен' claim conflicts with SHOP-101).
    evidence:
      - e33
      - e35
      - e36
