rationale: |-
  As "User with Read & Write share" on a project owned by `owner` (project 19, shared with admin/writer/reader), I walked the project settings menu in each state and then tried every action, also via its direct address, reading the project back after each attempt.

  Active: the menu offers Edit, Views, Background settings, Share, Duplicate, Archive, Subscribe, Webhooks, Create project — no Delete. Edit works (e6). Archive works (e12). Duplicate works and creates a copy the user can manage themselves (e9, e27). Share opens but is read-only: user and team lists with no add/remove/permission controls and no link-share section (e7), in contrast with a project the user owns (e27). Delete is absent from the menu; /settings/delete opens the confirmation, but confirming leaves the project active (e23–e25).

  Archived: only Un-Archive is offered, and it works (e19). Edit is reachable by address but saving fails with "The project is archived and can therefore only be accessed read only" and the title is unchanged (e14–e16). Share stays viewable read-only (e18). Duplicate reached by address succeeds and the copy is created already archived (e17).

  In the trash: the project is not listed in Trash → Projects (empty, e21) and there is no project menu, but opening the project address shows "This project is in the trash. owner deleted it 2 minutes ago / Deleted permanently in 30 days" (e22) — a read the model's read permit (active, archived) does not cover.

  New ops: a read action for seeing who a project is shared with, a permit to read a project while it is in the trash, and two duplicate transitions (copy of an active project starts active, copy of an archived project starts archived). What could not be done is left out, since the model denies it by default; those are recorded as findings.
