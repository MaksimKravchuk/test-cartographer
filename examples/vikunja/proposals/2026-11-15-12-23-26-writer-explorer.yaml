      - e17
findings:
  - kind: confirmation
    note: "Edit, Archive and Un-Archive really work for a Read & Write share: the title of active project 19 changed to 'w-edit-active' after saving, archiving turned it archived, and Un-Archive turned it active again."
    refs:
      - update
      - archive
      - unarchive
    evidence:
      - e5
      - e6
      - e10
      - e11
      - e12
      - e19
  - kind: confirmation
    note: "Delete is not offered to a Read & Write share: the project settings menu of the shared active project has no Delete entry, and although /projects/19/settings/delete opens the 'Delete this project' confirmation, confirming it leaves the project active."
    refs:
      - trash
      - delete_needs_admin
    evidence:
      - e4
      - e23
      - e24
      - e25
  - kind: contradiction
    note: The read permit covers only the active and archived states, but a Read & Write share can still open a trashed project's address and read that it is in the trash, who deleted it and that it will be deleted permanently in 30 days - while the same user's Trash -> Projects list is empty. Proposed as permit read_in_trash_read_write; a person should decide whether reading a trashed project this way is intended.
    refs:
      - read
      - view_trash
      - restore_needs_admin
    evidence:
      - e21
      - e22
  - kind: contradiction
    note: The model gives every sharing action to owner and admin only, yet the web app offers 'Share' in the project menu to a Read & Write share and shows the lists of users and teams. Nothing can be changed there (no add field, no permission dropdown, no remove button, no link shares), so it is a view rather than a change - proposed as the new view_shares action and permit. The same dialog on a project the user owns does show all those controls.
    refs:
      - share_user
      - share_team
      - change_share_permission
      - share_management_needs_admin
      - link_share_list_needs_admin
    evidence:
      - e4
      - e7
      - e18
      - e27
  - kind: question
    note: On an archived project the menu offers only Un-Archive, but the Edit, Share and Duplicate pages are still reachable from the address bar. Edit then fails with 'The project is archived and can therefore only be accessed read only...' and nothing changes, Share shows read-only, but Duplicate succeeds. Is duplicating an archived project meant to be possible for a Read & Write share, given the menu hides it?
    refs:
      - duplicate
      - archived_is_read_only
    evidence:
      - e13
      - e14
      - e16
      - e17
  - kind: question
    note: "Neither duplicate could be verified with the model's reader: reading project 22 (copy of the active project) and project 23 (copy of the archived project) both answer 'You don't have the permission to see this', apparently because the copy belongs to the user who duplicated it and not to the account the reader uses. The copies' states are evidenced only from the web app: 22 appears in the project list as an ordinary project, 23 shows the archived notice and stays out of the list."
    refs:
      - duplicate_from_active
      - duplicate_from_archived
    evidence:
      - e9
      - e17
      - e27
  - kind: question
    note: "Besides the six actions in scope, the project menu of the shared active project also offers a Read & Write share: Views, Background settings, Webhooks, Subscribe and 'Create project' (a sub-project under the shared project). None of these are in the model and none were tried in this run."
    refs:
      - create
      - move
    evidence:
      - e4
