findings:
  - kind: gap
    note: Four existing rules (project.link_share_has_no_trash, project.link_share_list_needs_admin, project.link_share_password, task.permanent_delete_needs_admin) describe what someone using a link share may do, but the model has no role for that subject — only signed-in users and a guest. help-sharing says a link-share recipient uses the project at the chosen permission level without an account, so the subject exists in the requirements; proposed as role link_share. Searched help-sharing, help-permissions, help-trash.
    refs:
      - role:link_share
      - rule:project.link_share_has_no_trash
    evidence:
      - e6
      - e10
  - kind: gap
    note: "Teams are still not modeled: help-sharing documents creating a team, adding/removing members, the team admin role and sharing a project with a team (current and future members get access), and help-permissions says a team share applies the level to every member. The project entity has share_team and change_share_permission, but there is no team entity with its own actions, so nothing covers team creation or membership. Searched help-sharing ('Teams', 'Managing team members', 'Team admin role') and help-permissions."
    refs:
      - action:project.share_team
    evidence:
      - e7
      - e109
  - kind: gap
    note: "No journeys exist: both entities have `scenarios: []`, so no path through the transitions (e.g. create project -> share -> create task -> mark done -> trash -> restore) is described, and the stories in the backlog cover single rules instead. Searched the whole model; the help pages describe each operation separately and none of them prescribes an end-to-end flow."
    evidence:
      - e95
  - kind: gap
    note: "Backlog coverage: no feature slices project.read, project.update's archived-project behaviour, or the trash-viewing actions (added project.view_shares and the view_trash/purge_expired actions to the existing features in this proposal). Nothing in the backlog covers the favorite actions either, which is why the favorites feature is proposed. Searched the backlog's three epics and six features."
    refs:
      - feature:trash_and_restore
      - feature:project_sharing
    evidence:
      - e95
      - e100
  - kind: confirmation
    note: "The backlog's three epics match the sources' own structure: help-projects for projects and tasks, help-permissions/help-sharing for sharing, help-trash for trash and recovery, including the 30-day retention that the trash epic describes."
    refs:
      - epic:trash
      - epic:sharing
      - epic:projects_and_tasks
    evidence:
      - e24
      - e10
      - e97
  - kind: question
    note: "Several help-projects and help-tasks features are documented but deliberately unmodeled: project views (list/kanban/gantt/table), background images, webhooks, project and task subscriptions, saved filters, quick add magic, labels, attachments, comments, relations and time tracking (help-trash describes running timers stopping and time entries becoming read-only). Should any of them enter the model, or is the scope projects+tasks only? Searched help-projects, help-tasks, help-trash."
    evidence:
      - e108
      - e107
