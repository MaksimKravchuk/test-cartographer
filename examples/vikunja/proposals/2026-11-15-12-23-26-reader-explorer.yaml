  - op: add
    kind: rule
    value:
      id: read_only_offers_no_task_actions
      title: A Read only share is offered no task actions
      text: "On a task in a project shared Read only nothing can be acted on: the done checkbox in the list, table and kanban views is disabled, the task detail view shows no action buttons (no Mark task done, Assign, Labels, Move, Duplicate, Delete), the title and description cannot be edited, there is no comment box, and the keyboard shortcuts of the task page (mark done, delete, favourite) do nothing. The same user's own task shows the full set of those buttons."
