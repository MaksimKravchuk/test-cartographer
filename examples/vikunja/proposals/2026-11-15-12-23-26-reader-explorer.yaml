      - e4
findings:
  - kind: confirmation
    note: 'A Read only share can open and read a task in both the open and the done state: the task appears in the list, table, kanban and gantt views of the shared project and its detail view opens with title, number, breadcrumb, Done badge and creation/completion times. This matches the existing permit "read" for the reader.'
    refs:
      - read
      - task_access_follows_project
    evidence:
      - e5
      - e6
      - e8
      - e13
  - kind: contradiction
    note: 'The web app offers a task verb to a Read only share that the server then refuses: every task row has an "Add to Favorites" button. In the active shared project the server answers "Forbidden" (shown twice), in the archived shared project it answers "The project is archived and can therefore only be accessed read only...". The model has no favourite action at all, so this verb (and its refusal for a Read only share) is not described anywhere; I proposed the action and a rule, a person should decide whether offering the button is intended.'
    refs:
      - read_only_cannot_change
    evidence:
      - e11
      - e25
    searched:
      - task detail view of tasks 16/17/19
      - list, table, kanban, gantt views of projects 18 and 43
      - Task Page keyboard shortcuts
  - kind: question
    note: A Read only share cannot see the project's deleted task in the trash (the trash says "There are no tasks in the trash." and Empty trash is disabled), yet opening that same deleted task by its own link still shows a page telling who deleted it, how long ago, and that it will be deleted permanently in 30 days. Is this leak of the deletion notice to a Read only share intended? I proposed a separate permit for it rather than widening the existing view_trash permit, because the task genuinely is not listed in the trash.
    refs:
      - view_trash
      - restore_needs_write
    evidence:
      - e9
      - e10
      - e4
  - kind: contradiction
    note: 'Project actions a Read only share must not have are hidden from the menus but still reachable by their direct links, with the forms fully enabled: /projects/<id>/settings/edit opens the Edit This Project dialog with an editable title and Save (Save answers "Forbidden", the title stays), /projects/<id>/settings/archive opens the archive confirmation (Do it! answers "Forbidden", the project stays active), /projects/<id>/settings/delete opens the delete confirmation (after Do it! the dialog stays open and the project remains in the sidebar). This is about the related Project entity, so I did not propose model operations for it.'
    refs:
      - project
    evidence:
      - e15
      - e16
      - e17
      - e20
      - e21
      - e22
  - kind: confirmation
    note: "No project action is offered to a Read only share through the interface itself: the shared project has no \"Open project settings menu\" button in the sidebar nor on the projects overview (only \"Mark this project as favorite\"), while the user's own Inbox has one; the shared project's list view has no \"Add a task\" field and its kanban view has no bucket or card creation controls."
    evidence:
      - e5
      - e12
      - e36
  - kind: question
    note: 'The model relates a Task to a project that "requires: active", but a Read only share can read tasks of an archived project without any limitation (task list and detail view of project 43 and tasks 19/20). Should the Task model describe the archived-project case as a variant/condition rather than assume an active project?'
    refs:
      - task_access_follows_project
    evidence:
      - e24
      - e26
      - e23
  - kind: question
    note: The Task Page keyboard shortcuts documented in the app's own Keyboard Shortcuts dialog (t mark done / undone, Delete delete this task, s favourite, m move, a assign, e edit description) produce no reaction at all for a Read only share — no change and no error message — so no server answer could be recorded for those verbs; read() of task 16 afterwards still shows it open. It cannot be told from the interface whether the request was never sent or silently refused.
    evidence:
      - e27
      - e28
      - e29
      - e30
  - kind: question
    note: 'The server answer to a Read only share confirming "Delete this project" could not be captured: after Do it! the dialog stayed open and the project remained listed, but the toast had already disappeared by the time of the next snapshot. Edit and Archive under the same conditions both answered "Forbidden".'
    evidence:
      - e21
      - e22
      - e16
      - e20
