id: 2026-11-15-12-23-26-reader-explorer
entity: task
agent: reader-explorer
role: reader
createdAt: 2026-11-15T12:29:45.208Z
baseRevision: d2dd1149faf0
rationale: |-
  Explored the Task entity as a user with a Read only share, in a project shared Read only while active (project 18, tasks 16 open / 17 done / 18 in the trash) and while archived (project 43, tasks 19 open / 20 done), plus a baseline task of my own (task 21) to see which verbs the app offers when it is allowed.

  What the app offers / refuses to a Read only share:
  - Viewing works everywhere: list, table, kanban and gantt views show both open and done tasks, and the task detail view opens (e5, e6, e8, e12, e13, e24, e26). The detail view carries no action buttons at all, the "done" checkbox is disabled, the description is not editable and there is no comment box — compare the same user's own task, which gets Mark task done!, Add Labels, Assign, Move, Duplicate, Delete, comments etc. (e34).
  - Every Task Page keyboard shortcut (t = done, Delete = delete, s = favorite) does nothing; read() shows task 16 still open afterwards (e27, e28, e29, e30).
  - One task verb IS offered and then refused by the server: "Add to Favorites" next to each task in the list. In the active project the answer is "Forbidden" (e11); in the archived project the answer is "The project is archived and can therefore only be accessed read only. This is also true for all tasks associated with this project." (e25). The button stays unchanged in both cases.
  - In the trash the project's deleted task is not listed ("There are no tasks in the trash.") and Empty trash is disabled (e10), but opening the deleted task by its own link still shows a page saying "This task is in the trash. owner deleted it just now." and "Deleted permanently in 30 days" (e9) — no Restore and no Delete forever.
  - Project actions: no project settings menu is offered for the shared project, either in the sidebar or on the projects overview (e5, e36) — only "Mark this project as favorite". The Edit / Archive / Delete project dialogs are nevertheless reachable by their direct links and are fully filled in; Save and Archive answer "Forbidden" and nothing changes (e15, e16, e17, e20), and the Delete confirmation leaves the project in place (e21, e22).

  I propose the favourite verb as a new action (it is a task verb the model does not name yet) with a rule about it needing more than a Read only share, a rule describing that a Read only share is offered no task actions at all, a rule for the archived-project refusal message, and a permit for the deletion notice a Read only share can still open by link. Everything the role simply cannot do is left out of the model and recorded as findings instead.
