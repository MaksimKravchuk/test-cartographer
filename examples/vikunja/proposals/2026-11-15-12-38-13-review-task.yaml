baseRevision: 09e695be16f7
rationale: |-
  Reviewed every element of the two entities against all five help pages (read in full) and the pkg/models code (project.go, project_permissions.go, project_access.go, project_trash.go, project_purge.go, project_duplicate.go, project_users*.go, link_sharing_permissions.go, tasks.go, tasks_permissions.go, task_trash.go, task_delete_cron.go, task_duplicate.go, task_assignees*.go, favorites.go). Almost all rules are confirmed by a priority-1 help page or, where the help pages are silent about permissions, by the code only. Three real disagreements: (a) both entities' state `match` values name a `status` field that no source knows — the project is observable through `is_archived`/`deleted_at`, the task through `done`/`deleted_at` (the task entity's own invariant already uses `done`), so I propose aligning the matches that the code pins down and left `in_trash`/`purged` as questions; (b) help-permissions/help-sharing say every sharing method, link shares included, gets the same three levels and that Admin manages sharing, while the code refuses a link share any share management at all; (c) the code lets an Admin link share move a project to the trash although help-trash says link-share users have no trash — the project would land where its deleter cannot see it. Requirements win in (b) and (c) by priority; both are flagged for a human. New requirements found in the help pages and missing from the model: the done-bucket toggle marks a task done/undone, Empty trash scope (tab-local, only items you may purge, optional "also delete items other people moved"), favoriting a project, and creating a sub-project. Code-only behaviour proposed and labelled as behaviour, not requirement: no cyclic nesting, no move under an archived parent, sub-project creation needs write on the parent, a repeating task's checklist is unchecked when it reopens. A link-share recipient is added as a role because four existing rules talk about them with no subject to bind to.

  Open questions:
  1. Read-only sees a deleted task's notice — answered: intended in code ("Readers of the project get ErrTaskIsInTrash"), with CanRestore false; the same holds for projects, so I propose widening read_in_trash_read_write to the reader.
  2. Task of an archived project readable by Read only — answered: reading a task only resolves project read access; the archived check lives in CanWrite, so the relation's `requires: active` is too strong (contradiction filed).
  3. Keyboard shortcuts silent for Read only — still open: no source describes shortcut handling; code only gates the write itself.
  4. Server answer to a Read only "Delete this project" — partly: CanDelete is IsAdmin, so a refusal is expected; no source states the message.
  5. Duplicating an archived project as a writer — answered: read access plus write on the copy's parent is enough and the copy is re-archived afterwards.
  6. Copies unreadable by the reader account — answered: the duplicate's owner is set to the duplicating user.
  7. Extra menu entries (views, backgrounds, webhooks, subscribe, create project) — partly: sub-project creation needs write on the parent (proposed); views/backgrounds/webhooks/subscriptions remain unmodeled (gap filed).
  8. Permission needed to archive/unarchive/edit — still open as a requirement; code requires write access (confirmed).
  9. Permission needed to duplicate — still open as a requirement; code-only (confirmed, gap filed).
  10. Default project cannot be archived — partly: code confirms it, all five help pages are silent.
  11. Where a project in the trash is observable — partly: `deleted_at` is the only documented signal (code); the UI notice is described but names no field.
  12. Can an Admin link share trash the project — answered: yes in code, and it then has no trash to see it; contradiction filed against help-trash.
  13. Permission needed to mark a task done or edit it — still open as a requirement; code requires write access.
  14. Does a restored task stay done — partly: code restores it into the done bucket without touching `done`; no page states it.
  15. Where a task in the trash is observable — partly: `deleted_at` (code) plus the "This task is in the trash." notice.
  16. Repeating tasks only in code — partly: help-tasks mentions "repeat settings" when duplicating, but no sourced page describes repeating behaviour.
  17. Broad task.update folding comments/labels/dates — still open: a scope decision, nothing new in the sources.
  18. Permission inheritance to sub-projects — partly: code confirms (inherited Admin sticky, nearest grant otherwise); no help page mentions it.
  19. Teams unmodeled — still open: help-sharing documents teams and team admins; no team entity exists.
  20. Where to read entities back — partly: the code names the observable fields (is_archived, done, deleted_at, deleted_by); choosing web vs API stays a human decision.
