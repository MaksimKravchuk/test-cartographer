findings:
  - kind: contradiction
    note: "The states name a field no source knows. The model matches task states on `status` (open/done/trashed/purged), but the only source that names observable fields — the code — has a boolean `done` plus `done_at` and `deleted_at`, and the entity's own invariant done_task_records_when already uses holds {done: true}, so the model contradicts itself as well. The help pages only describe the Done button. The code wins by default (no priority-1 source names fields), so open/done are proposed as done:false / done:true; in_trash and purged are left alone because deleted_at is a timestamp and nothing describes a purged task."
    refs:
      - state:task.open
      - state:task.done
      - state:task.in_trash
      - state:task.purged
      - invariant:task.done_task_records_when
    evidence:
      - e70
      - e71
  - kind: contradiction
    note: "The relation to the project requires state active, but a task of an archived project stays readable: the code resolves task read access purely through project read access, and the archived check lives only in the write path, which is also why help-trash can say tasks of an archived project are visible yet not restorable. Nothing in the help pages says an archived project hides its tasks — help-projects only says it becomes read-only. So the relation's `requires: active` is too strong for reads and should be expressed as a condition on the write transitions (where rules mark_done_needs_active_project, reopen_needs_active_project and trash_open_needs_active_project already state it). This answers the open question about the archived-project case."
    refs:
      - rule:task.task_access_follows_project
      - permit:task.read
      - rule:task.mark_done_needs_active_project
    evidence:
      - e106
      - e36
      - e12
  - kind: confirmation
    note: A Read & Write share may create, update and delete tasks in the project, and a Read only share may view them but change nothing; the code routes every task change through write access on the project.
    refs:
      - rule:task.write_can_create_update_delete
      - rule:task.read_only_cannot_change
      - rule:task.task_access_follows_project
      - permit:task.update
      - action:task.create
      - transition:task.create
    evidence:
      - e2
      - e1
      - e77
  - kind: confirmation
    note: "Creating and editing a task: the create input sits at the top of the list view or on the dashboard, and the detail view is where title, description, dates, labels, assignees and attachments are edited. The code refuses an empty title."
    refs:
      - action:task.create
      - action:task.update
      - action:task.read
      - rule:task.title_required
    evidence:
      - e98
      - e101
      - e72
  - kind: confirmation
    note: The Done button marks a task completed and pressing it again reopens it; the code stamps done_at when it is marked done and clears it when it is reopened.
    refs:
      - transition:task.mark_done
      - transition:task.reopen
      - action:task.mark_done
      - action:task.reopen
      - invariant:task.done_task_records_when
    evidence:
      - e41
      - e73
  - kind: confirmation
    note: A task with a repeat interval reopens when marked done and its due date and reminders move on by that interval — code only, as the variant's and rule's observed status says. help-tasks mentions 'repeat settings' only in passing (when duplicating) and links a Dates & Reminders page that is not among the sources.
    refs:
      - variant:task.repeating
      - transition:task.mark_done_repeating
      - rule:task.repeating_task_reopens
    evidence:
