findings:
  - kind: contradiction
    note: "The states name a field no source knows. The model matches project states on `status` (active/archived/trashed/purged), while the only source that says what is observable — the code — exposes `is_archived` (boolean) and `deleted_at`; there is no `status` field on a project anywhere, and the five help pages describe only the UI (project list, archived notice, trash listing) without naming fields. The code wins here by default because no priority-1 source speaks about observable values at all, so I propose matching active/archived on `is_archived`. in_trash and purged are left untouched: `deleted_at` is a timestamp, not a value a match can pin, and nothing describes a purged project at all."
    refs:
      - state:project.active
      - state:project.archived
      - state:project.in_trash
      - state:project.purged
    evidence:
      - e68
      - e69
  - kind: contradiction
    note: "Who may manage shares. The model's permits share_user/share_team/change_share_permission are limited to owner and admin, and rule share_management_needs_admin says Admin is enough; help-permissions (priority 1) says Admin level includes managing sharing and help-sharing says every sharing method, link shares included, uses the same three levels — so an Admin link share should be able to manage shares. The code (priority 2) refuses any link share outright: 'Link shares aren't allowed to do anything'. The help pages win by priority, so the requirement is that an Admin share manages sharing regardless of how it was granted; the code's extra restriction on link shares should be confirmed as intended or treated as a defect. The model currently states neither side because it has no link-share role (one is proposed)."
    refs:
      - permit:project.share_user
      - permit:project.share_team
      - permit:project.change_share_permission
      - rule:project.share_management_needs_admin
    evidence:
      - e8
      - e10
      - e66
  - kind: contradiction
    note: An Admin link share can move the project to the trash, but has no trash. transition:project.trash lists only owner and admin and rule link_share_has_no_trash says link-share users have no trash at all (help-trash, priority 1); the code treats an Admin link share as project admin and CanDelete is exactly that admin check, so such a recipient can delete the project, while the trash listing and getReadableTrashedProject explicitly exclude link shares — the project lands somewhere its deleter cannot see or restore. help-trash wins by priority (a link-share recipient should not reach the trash); either the delete must be refused for link shares or the rule needs an exception. This answers the open question on the subject.
    refs:
      - transition:project.trash
      - rule:project.link_share_has_no_trash
      - rule:project.delete_needs_admin
    evidence:
      - e23
      - e67
      - e104
      - e103
