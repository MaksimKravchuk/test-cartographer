findings:
  - kind: contradiction
    note: help-projects says duplicating a project creates copies of its tasks, views, sub-projects and settings, while the code's duplicate copies tasks, views, buckets and the background but never sub-projects, and copies the user/team/link shares only when duplicate_shares is asked for (default off). Requirements outrank code, so the help wording is kept as the rule, but the behaviours differ and need a decision.
    refs:
      - project.duplicate
    evidence:
      - e9
      - e11
    searched:
      - help-projects 'Duplicating a project'
      - vikunja-models/project_duplicate.go
  - kind: gap
    note: No help page says that a permission granted on a project also applies to its sub-projects; the code resolves access through project ancestors (nearest grant wins, inherited Admin always applies). Searched help-permissions ('Where permissions apply'), help-sharing and help-projects ('Sub-projects') — none mentions inheritance. Proposed as a code-evidenced rule on the project entity.
    refs:
      - project.read
    evidence:
      - e12
    searched:
      - help-permissions
      - help-sharing
      - help-projects
      - vikunja-models/project_access.go
  - kind: gap
    note: "Teams themselves (creating a team, adding/removing members, the team admin role) are documented in help-sharing but not modeled: this run's scope is projects and tasks. A separate team entity with its own actions is still missing."
    evidence:
      - e8
      - e108
    searched:
      - help-sharing 'Teams', 'Team admin role'
  - kind: confirmation
    note: The three permission levels in the help pages (Read only, Read & Write, Admin) match the code's permission enum for projects, so the existing reader/writer/admin roles map one-to-one onto documented share levels.
    evidence:
      - e7
      - e107
    searched:
      - help-permissions
      - vikunja-models/permissions.go
  - kind: question
    note: Neither entity has a reader yet, so no state can be verified by reading the object back. The five help pages describe the web UI only (sidebar, three-dot menus, trash screen) and give no field names a tester could assert on. Where should a project or task be read back from — the web app or the API?
    searched:
      - help-projects
      - help-tasks
      - help-trash
      - help-sharing
      - help-permissions
