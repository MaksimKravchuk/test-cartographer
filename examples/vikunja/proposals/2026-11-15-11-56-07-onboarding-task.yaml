baseRevision: new
rationale: |-
  Read all five help pages in full and the parts of pkg/models that implement project and task behaviour (project.go, project_permissions.go, project_trash.go, project_access.go, project_duplicate.go, project_users*/project_team*/link_sharing_permissions.go, tasks.go, tasks_permissions.go, task_trash.go, task_assignees.go, task_duplicate.go, task_delete_cron.go, permissions.go). Skipped tests, views/filters/CalDAV/labels/attachments per scope.

  Proposed: two roles the model lacked (a link-share recipient without an account, and the scheduled trash cleanup as a system subject), the project and task entities, and for each one its states (active/archived/in trash/deleted permanently; open/done/in trash/deleted permanently), actions, transitions with who may move them, permits for the actions that change nothing but need a permission level, and the rules the help pages state in their own words. Permission-level wording follows the help pages (Read only / Read & Write / Admin), mapped onto the existing reader/writer/admin/owner roles. Where only the code states a condition (reparenting needs Admin on both projects, archiving a default project is refused, duplicate needs read + write on the parent, permission cascades down the project tree) the rule cites the code and is paired with a finding that the help pages are silent, so a reviewer can decide. The backlog is a thin slice over these actions: three epics (Projects and tasks, Sharing and permissions, Trash and recovery), six features by action, eight stories whose acceptance comes straight from the help pages; there is no tracker export among the sources, so no story carries a key/url and none invents a ref.

  Reported disagreements: help-projects says duplicating a project copies its sub-projects and settings, while the code copies tasks, views and background, copies shares only when asked, and does not copy sub-projects (contradiction, docs outrank code but the behaviour differs). Also raised as questions: which permission archives/edits a project, whether a link-share recipient with Admin can trash a project at all given link shares have no trash, and whether a restored task keeps its done state.

  Open questions from model(): none were left by earlier runs (openQuestions was empty), so there is nothing to answer back; the questions in this proposal are new ones.
