rationale: "BLOCKER FIRST: I could not read the model. model() returns 67.8 KB, which this session truncates to a 2 KB preview, and there is no paging parameter; the Read and Bash tools are disabled here, so the persisted tool-result file is unreachable; and read()/files() on the code source refuse to leave the code folder (\"is outside the code folder\"). The only part of the model I ever saw is the beginning of project.roles: guest, owner, admin, writer, reader, outsider. I therefore did NOT propose any ops: with the entities, actions, transitions, permits, rules, invariants and backlog invisible, every add would risk duplicating something the model already has, and every \"contradiction\" against an element I cannot read would be guesswork. What I did instead, with all five help pages read end to end and the relevant parts of pkg/models read (permissions.go, project_permissions.go, project.go, project_trash.go, project_duplicate.go, task_trash.go, tasks_permissions.go, task_delete_cron.go, task_assignees.go, link_sharing.go, link_sharing_permissions.go, teams_permissions.go, team_members_permissions.go, admin_bypass.go, time_tracking.go, kanban_task_bucket.go, models.go): a full requirements-vs-code matrix, every cell quoted on both sides, so the reviewer can map each row onto their own elements in one pass. 24 rows agree (confirmations), 2 disagree (contradictions), 4 are code-only behavior (gaps), and the roles I could see are confirmed or flagged. Highlights: help-projects says duplicating a project copies its sub-projects, the code copies tasks, views, buckets, background and (optionally) shares but never child projects — docs win by priority, so this is a product bug or a doc bug, not a model change; help-permissions (\"Admin = full access, same levels for link shares\") collides with help-trash (\"People who use a link share don't have a trash\"), two priority-1 pages, and the code sides with the more specific trash page. Code-only behavior worth a decision: an instance-admin bypass gated by the admin-panel license that no help page mentions, a link-share auth that can never create projects or see a trash, and a \" - duplicate\" suffix on a duplicated project's title. Open questions: the model's openQuestions list was inside the truncated part of model(), so I could not read it and could not answer any of them — still open, for the tooling reason above, and I recommend a paged or per-entity model() (e.g. model({ entity }) or a 20 KB page) before the next review run."
