rationale: "Review run against the five Vikunja help pages (priority 1) and pkg/models v2.8.0 (priority 2). One blocker shapes this proposal: model() returns 67.8 KB and this session's harness truncates every tool result to a 2 KB preview, so I could only read project.roles (guest, owner, admin, writer, reader, outsider — cut off mid-\"outsider\") and the web interface. I retried model() three times (also with extra args, which are ignored), and tried to reach the persisted tool-result file through read()/files() (blocked outside the code folder); there is no Read/Bash/Grep tool in this session. I therefore could not see any entity, state, action, transition, permit, rule, invariant or backlog item, and I deliberately propose no ops: every entity-level add would be a blind guess that risks duplicating elements the model already has, and refs/covers for ids I cannot see would be invented. What I did instead: filled the element × source matrix for the elements the preview did expose (six roles + interface:web), and recorded every requirement and every code-only behavior I found in the sources as findings with quotes on both sides, so the next run (or this one, with a paginated/compact model()) can turn them into rule/action/transition ops against real ids. Sources read in full: help-permissions, help-sharing, help-projects, help-tasks, help-trash; code read: project_permissions.go, tasks_permissions.go, project_trash.go, task_trash.go, task_delete_cron.go, project_purge.go, link_sharing.go, link_sharing_permissions.go, teams_permissions.go, team_members_permissions.go, project_team_permissions.go, project_users_permissions.go, task_assignees.go, admin_bypass.go (tests skipped). Docs and code agree everywhere I could compare (30-day retention and the hourly sweep, the trash permission matrix, restore blockers, default-project deletion, assignee access), so I report no doc-vs-code contradiction; the one open conflict (link shares \"cannot be edited\" vs a link-share update permission check in code) is filed as a question because I did not read the route table. Open questions left by earlier runs: none were visible to me — model().openQuestions sits in the truncated part of the output, so every one of them is still open and unanswered for the reason above; please re-run with a model() that can be read in pages so they can be answered one by one."
