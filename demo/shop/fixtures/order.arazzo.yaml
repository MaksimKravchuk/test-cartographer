arazzo: 1.0.1
info: { title: Shop fixtures, version: 1.0.0 }
sourceDescriptions:
  - { name: shop, url: ./shop.openapi.yaml, type: openapi }
workflows:
  - workflowId: orderFromListing
    summary: Publish a listing and place an order for it in the given status.
    inputs:
      type: object
      properties:
        status: { type: string }
        tag: { type: string }
        token: { type: string, format: password }
      required: [status, token]
    steps:
      - stepId: listing
        operationId: createListing
        parameters: [{ name: x-test-token, in: header, value: $inputs.token }]
        requestBody: { payload: { variant: physical, status: published, tag: $inputs.tag } }
        successCriteria: [{ condition: $statusCode == 201 }]
        outputs: { id: $response.body#/id }
      - stepId: order
        operationId: createOrder
        parameters: [{ name: x-test-token, in: header, value: $inputs.token }]
        requestBody: { payload: { variant: standard, status: $inputs.status, tag: $inputs.tag, listingId: $steps.listing.outputs.id } }
        successCriteria: [{ condition: $statusCode == 201 }]
        outputs: { id: $response.body#/id, total: $response.body#/total }
    outputs:
      orderId: $steps.order.outputs.id
      listingId: $steps.listing.outputs.id
      total: $steps.order.outputs.total
