# Deterministic script for the onboarding agent (provider=scripted).
steps:
  - say: Listing the uploaded knowledge sources.
    call: sources
  - say: Reading the product overview end to end.
    call: source
    input:
      id: product-overview
      limit: 200
  - say: Reading the backlog export end to end.
    call: source
    input:
      id: backlog
      limit: 200
  - say: Reading the current model.
    call: model
  - say: Quoting the cancellation rule.
    call: quote
    input:
      source: product-overview
      text: A buyer can cancel an order only until it has been paid.
  - call: quote
    input:
      source: product-overview
      text: Once payment has been captured, only the seller can cancel the order, by rejecting it.
  - say: Quoting the archiving rule.
    call: quote
    input:
      source: product-overview
      text: "A seller can archive a listing in any state: draft, published, or out of stock."
  - say: Quoting the reviews feature.
    call: quote
    input:
      source: product-overview
      text: "Once an order has been delivered, the buyer can leave a review of the listing they bought: a star rating from one to five and a short comment."
  - call: quote
    input:
      source: product-overview
      text: The buyer can edit or remove their own review at any time
  - call: quote
    input:
      source: product-overview
      text: The seller may post a single public response to each review
  - say: Quoting the unpaid-order expiry.
    call: quote
    input:
      source: product-overview
      text: an order that has not been paid within 30 minutes of being placed is cancelled automatically by the shop backend
  - say: Quoting the epics.
    call: quote
    input:
      source: backlog
      text: Placing, paying for, and cancelling an order — the buyer side of a purchase from a published listing.
  - call: quote
    input:
      source: backlog
      text: Everything a seller does to create, publish, and retire their own listings.
  - call: quote
    input:
      source: backlog
      text: Getting a paid order from acceptance through to the buyer having it in hand, including pre-orders.
  - call: quote
    input:
      source: backlog
      text: Buyers rating and commenting on what they bought, and sellers responding.
  - say: Quoting the features.
    call: quote
    input:
      source: backlog
      text: A signed-in buyer places and pays for an order from a single published listing.
  - call: quote
    input:
      source: backlog
      text: Cancelling an order before or after payment, with a refund whenever payment was captured.
  - call: quote
    input:
      source: backlog
      text: Creating, publishing, marking out of stock, and restocking a listing.
  - call: quote
    input:
      source: backlog
      text: Retiring a listing for good, from whichever state it happens to be in.
  - call: quote
    input:
      source: backlog
      text: "The seller's first decision on a paid order: accept it or reject it with a refund."
  - call: quote
    input:
      source: backlog
      text: Getting an accepted standard order to the buyer, and issuing a digital key immediately after payment.
  - call: quote
    input:
      source: backlog
      text: Accepting an order before its item is back in stock and moving it forward once stock arrives.
  - call: quote
    input:
      source: backlog
      text: A buyer rating and commenting on a delivered purchase, and the seller responding.
  - say: Quoting the stories.
    call: quote
    input:
      source: backlog
      text: As a buyer, I want to buy a published physical listing so that I can receive the item.
  - call: quote
    input:
      source: backlog
      text: As a buyer, I want to pay for my order so that the seller can fulfil it.
  - call: quote
    input:
      source: backlog
      text: As a buyer, I want to cancel an order I haven't paid for so that I'm not stuck with something I no longer want.
  - call: quote
    input:
      source: backlog
      text: As a buyer, once I've paid for an order, cancelling is the seller's call — I can ask them to reject it, but I can't cancel it myself.
  - call: quote
    input:
      source: backlog
      text: As a seller, I want to create a listing and publish it so that buyers can find and buy it.
  - call: quote
    input:
      source: backlog
      text: As a seller, I want to mark a listing out of stock so buyers don't try to buy something I can't fulfil.
  - call: quote
    input:
      source: backlog
      text: As a seller, I want to restock a listing that ran out so it becomes buyable again.
  - call: quote
    input:
      source: backlog
      text: As a seller, I want to archive a listing I'm no longer selling, whether or not it was ever published.
  - call: quote
    input:
      source: backlog
      text: As a seller, I want to archive a listing that's out of stock without first restocking or unpublishing it, since I have no intention of selling it again.
  - call: quote
    input:
      source: backlog
      text: As a seller, I want to accept a paid order so I can start getting it ready to ship.
  - call: quote
    input:
      source: backlog
      text: As a seller, I want to reject a paid order I can't fulfil so the buyer gets their money back.
  - call: quote
    input:
      source: backlog
      text: As a seller, I want to mark an accepted order as shipped once it's on its way.
  - call: quote
    input:
      source: backlog
      text: As a buyer, I want to confirm I've received my order so it's marked complete.
  - call: quote
    input:
      source: backlog
      text: As a seller, I want a digital order to skip shipping entirely, since there's nothing physical to send.
  - call: quote
    input:
      source: backlog
      text: As a seller, I want to accept a pre-order before I have stock, so the buyer knows I'm committed to fulfilling it once it arrives.
  - call: quote
    input:
      source: backlog
      text: As a seller, I want to move a pre-order forward once stock is in, the same as any standard order from there.
  - call: quote
    input:
      source: backlog
      text: As a buyer, I want to rate and comment on something I bought once it's arrived, so other buyers can see how it went.
  - call: quote
    input:
      source: backlog
      text: As a buyer, I want to change my mind about a review I left, or take it down.
  - call: quote
    input:
      source: backlog
      text: As a seller, I want to publicly respond to a review so I can thank a happy customer or address a complaint.
  - say: Handing in the backlog and the new entity first, so they can be reviewed while I go on.
    call: record
    input:
      rationale: "The product overview and the tracker export agree on most of the shop as it already behaves, and add three things worth a decision: a documented cancellation rule the running app does not enforce, a seller archiving right the model does not have yet, and a buyer reviews feature the app does not have at all. The backlog is proposed as a slice over the existing actions, plus the new review entity and two pre-order stories the model cannot cover until the pending pre-order proposal is decided."
