        findings:
          - kind: contradiction
            note: "The product doc states that a buyer can cancel an order only until it is paid, and that once payment is captured only the seller can cancel it (by rejecting). The running demo shop does not enforce this: a buyer can still cancel a standard order after it is paid or already accepted by the seller, and the pending client-explorer proposal (cancel-paid, cancel-accepted) proposes confirming exactly that behavior. Story shop-112 encodes the doc's rule instead — one of the two has to give before those transitions are decided."
            refs:
              - shop-112
              - cancel-paid
              - cancel-accepted
            evidence:
              - e1
              - e2
          - kind: gap
            note: The doc and the tracker both treat buyer reviews as a shipped feature (epic Reviews, all its stories Done), but the demo shop exposes no review UI, API, or MCP tool at all. The review entity is proposed with no reader, so every scenario for it can only ever be planned blocked until an interface exists to verify it.
            refs:
              - review
              - shop-401
              - shop-402
              - shop-403
            evidence:
              - e4
          - kind: gap
            note: The pre-order fulfilment stories (shop-321, shop-322) describe an Awaiting stock state between Paid and Accepted that the order entity does not have yet — only the pending seller-explorer proposal adds it. Both stories are left with no covers rather than pointing at elements that do not exist in the model yet.
            refs:
              - shop-321
              - shop-322
            evidence:
              - e18
              - e34
              - e35
          - kind: question
            note: Story shop-313 ("Seller issues a digital key immediately after payment") is marked Done and matches the seller-explorer's pending deliver-key proposal, but that transition is not confirmed in the model yet, so shop-313 is left uncovered rather than citing an element that may still be rejected. Once that proposal is decided, should shop-313 point at it directly?
            refs:
              - shop-313
            evidence:
              - e33
