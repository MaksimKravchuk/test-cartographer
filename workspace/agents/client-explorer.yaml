# Deterministic script for the buyer storefront explorer (provider=scripted).
steps:
  - say: Reading the current model.
    call: model
  - say: Checking cancellation of a paid standard order.
    call: prepare
    input: { tool: shop.create_order, args: { variant: standard, status: paid } }
  - call: browser_navigate
    input: { url: "/orders/{{key}}" }
  - say: "Paid standard order: the buyer can “Cancel order”"
    call: browser_snapshot
  - call: browser_click
    input: { element: action-cancel, target: "getByTestId('action-cancel')" }
  - call: read
    input: {}
  - say: Checking cancellation of an order the seller already accepted.
    call: prepare
    input: { tool: shop.create_order, args: { variant: standard, status: accepted } }
  - call: browser_navigate
    input: { url: "/orders/{{key}}" }
  - say: "Order accepted by the seller: the buyer can still cancel it"
    call: browser_snapshot
  - call: browser_click
    input: { element: action-cancel, target: "getByTestId('action-cancel')" }
  - call: read
    input: {}
  - say: Checking a paid digital order.
    call: prepare
    input: { tool: shop.create_order, args: { variant: digital, status: paid } }
  - call: browser_navigate
    input: { url: "/orders/{{key}}" }
  - say: "Paid digital order: the buyer has no actions"
    call: browser_snapshot
  - say: Writing up the proposal.
    call: propose
    input:
      rationale: >-
        The buyer can cancel a paid standard order and gets a refund — and, unexpectedly, can also
        cancel an order the seller has already accepted. A paid digital order can't be cancelled.
      ops:
        - { op: add, kind: transition, evidence: [e1, e2], value: { id: cancel-paid, title: Cancel paid order, from: paid, to: cancelled, action: cancel, by: [client], variants: [standard], effects: [{ description: Money refunded, field: payment, equals: refunded }] } }
        - { op: add, kind: transition, evidence: [e3, e4], value: { id: cancel-accepted, title: Cancel accepted order, from: accepted, to: cancelled, action: cancel, by: [client], variants: [standard], effects: [{ description: Money refunded, field: payment, equals: refunded }] } }
      findings:
        - kind: contradiction
          note: >-
            Cancelling after the seller has accepted is probably not a requirement: the seller may
            already be packing the order. Suggest recording it as an observation and checking with product.
          refs: [cancel-accepted]
          evidence: [e3, e4]
        - kind: question
          note: >-
            Confirmed: a digital order can't be cancelled after payment. Once cancel-paid is scoped to
            variants: [standard] the closed world already denies it for digital — does that absence still
            deserve its own rule, for documentation, or is the matrix enough?
          refs: [cancel-paid]
          evidence: [e5]
