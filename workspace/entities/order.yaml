id: order
title: Order
description: A buyer's order in the marketplace
key: id
reader:
  tool: shop.get_order
  args:
    id: "{{key}}"
relations:
  - id: listing
    title: Listing
    entity: listing
    field: listingId
    requires: published
    variants:
      standard: physical
      digital: digital
variants:
  - id: standard
    title: Standard
  - id: digital
    title: Digital
states:
  - id: created
    title: Created
    initial: true
    match:
      status: created
    setup:
      - kind: tool
        tool: shop.create_order
        args:
          variant: "{{variant}}"
          status: created
          tag: "{{runTag}}"
          listingId: "{{rel.listing}}"
  - id: paid
    title: Paid
    match:
      status: paid
      payment: captured
    setup:
      - kind: tool
        tool: shop.create_order
        args:
          variant: "{{variant}}"
          status: paid
          tag: "{{runTag}}"
          listingId: "{{rel.listing}}"
  - id: accepted
    title: Accepted by seller
    variants: [standard]
    match:
      status: accepted
  - id: shipped
    title: Shipped
    variants: [standard]
    match:
      status: shipped
  - id: delivered
    title: Delivered
    terminal: true
    match:
      status: delivered
  - id: cancelled
    title: Cancelled
    terminal: true
    match:
      status: cancelled
actions:
  - id: place
    title: Place order
    kind: create
    run: order.place
  - id: pay
    title: Pay
    run: order.pay
  - id: cancel
    title: Cancel
    run: order.cancel
  - id: accept
    title: Accept
    run: order.accept
  - id: reject
    title: Reject
    run: order.reject
  - id: ship
    title: Ship
    run: order.ship
  - id: confirm
    title: Confirm receipt
    run: order.confirm
  # No run entry: nobody opens a page to do this, a background job does. No
  # human ever performs it, so it never shows up in the access matrix.
  - id: expire
    title: Expire
    description: An unpaid order times out and is cancelled by the shop itself.
    invoke:
      tool: shop.run_jobs
      args:
        only: "{{key}}"
        advanceMinutes: 31
    trigger: >-
      A "created" order nobody paid for within 30 minutes is cancelled automatically;
      the shop checks every minute.
  - id: view
    title: View order
    kind: read
    run: order.view
transitions:
  - id: place-order
    title: Place order
    from: "@new"
    to: created
    action: place
    by: [client]
    effects:
      - description: Nothing is charged yet
        field: payment
        equals: none
  - id: pay
    title: Pay
    from: created
    to: paid
    action: pay
    by: [client]
    effects:
      - description: Payment captured
        field: payment
        equals: captured
      - description: The listing's stock goes down by one
        relation: listing
        field: stock
        delta: -1
        variants: [standard]
  - id: cancel-unpaid
    title: Cancel
    from: created
    to: cancelled
    action: cancel
    by: [client]
    effects:
      - description: No money was charged
        field: payment
        equals: none
  - id: expire
    title: Expire
    from: created
    to: cancelled
    action: expire
    by: [system]
    effects:
      - description: No money was charged
        field: payment
        equals: none
  - id: accept
    title: Accept
    from: paid
    to: accepted
    action: accept
    by: [seller]
    variants: [standard]
  - id: reject
    title: Reject
    from: paid
    to: cancelled
    action: reject
    by: [seller]
    variants: [standard]
    guards:
      - The item is out of stock or the seller can't fulfill the order
    effects:
      - description: Money refunded to the buyer
        field: payment
        equals: refunded
      - description: The buyer sees the order as cancelled
  - id: ship
    title: Ship
    from: accepted
    to: shipped
    action: ship
    by: [seller]
  - id: confirm
    title: Confirm receipt
    from: shipped
    to: delivered
    action: confirm
    by: [client]
permits:
  # Any signed-in buyer or seller can open any order's page in any state (the
  # demo has no per-user ownership check on the read side) — a guest is
  # redirected to sign in before the page ever renders. See server.ts routeSide().
  - id: view-order
    title: View order
    action: view
    by: [client, seller]
rules:
  - id: only-published-listings
    title: Only published listings can be bought
    text: A buyer can place an order only for a listing that is published.
    transition: place-order
    requires:
      - kind: entity-state
        relation: listing
        states: [published]
  - id: signed-in-to-order
    title: Sign in to place an order
    text: A user must be signed in to create an order.
    transition: place-order
    requires:
      - kind: authenticated
invariants:
  - id: paid-for
    title: Paid for once accepted
    text: An accepted, shipped or delivered order always has its payment captured.
    states: [accepted, shipped, delivered]
    holds:
      payment: captured
scenarios:
  - id: standard-happy-path
    title: Standard order from placement to delivery
    description: The buyer places and pays; the seller accepts and ships; the buyer confirms receipt.
    variants: [standard]
    start: "@new"
    path: [place-order, pay, accept, ship, confirm]
