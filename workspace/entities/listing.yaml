id: listing
title: Listing
description: A seller's product listing in the marketplace
key: id
reader:
  tool: shop.get_listing
  args:
    id: "{{key}}"
variants:
  - id: physical
    title: Physical
  - id: digital
    title: Digital
states:
  - id: draft
    title: Draft
    initial: true
    match:
      status: draft
    setup:
      - kind: tool
        tool: shop.create_listing
        args:
          variant: "{{variant}}"
          status: draft
          tag: "{{runTag}}"
  - id: published
    title: Published
    match:
      status: published
    setup:
      - kind: tool
        tool: shop.create_listing
        args:
          variant: "{{variant}}"
          status: published
          tag: "{{runTag}}"
  - id: out-of-stock
    title: Out of stock
    variants: [physical]
    match:
      status: out_of_stock
  - id: archived
    title: Archived
    terminal: true
    match:
      status: archived
actions:
  - id: publish
    title: Publish
    run: listing.publish
  - id: unpublish
    title: Unpublish
    run: listing.unpublish
  # archive-draft and archive-published are one action: the seller archives a
  # listing from either state, and the two transitions only differ in `from`.
  - id: archive
    title: Archive
    run: listing.archive
  - id: mark-out-of-stock
    title: Mark out of stock
    description: The seller manually marks a published listing out of stock (independent of actual stock count).
    run: listing.mark-out-of-stock
  - id: restock
    title: Restock
    run: listing.restock
  # No run entry, no invoke tool: nothing in the test API fires this in
  # isolation, so its transition is planned but stays blocked. See ListingStore.sell()
  # in domain.ts — it's a side effect of an order being paid for, not a call anyone makes.
  - id: stock-depleted
    title: Stock depleted
    description: The last unit of a physical listing being paid for takes it out of stock.
    trigger: A paid order that empties a physical listing's stock takes it out of stock automatically.
transitions:
  - id: publish
    title: Publish
    from: draft
    to: published
    action: publish
    by: [seller]
    guards:
      - A physical listing must have stock > 0
    effects:
      - description: The listing appears in the buyer catalog
  - id: unpublish
    title: Unpublish
    from: published
    to: draft
    action: unpublish
    by: [seller]
  - id: archive-draft
    title: Archive a draft
    from: draft
    to: archived
    action: archive
    by: [seller]
  - id: archive-published
    title: Archive a published listing
    from: published
    to: archived
    action: archive
    by: [seller]
  - id: mark-out-of-stock
    title: Mark out of stock
    from: published
    to: out-of-stock
    action: mark-out-of-stock
    by: [seller]
    variants: [physical]
    effects:
      - description: Stock drops to zero
        field: stock
        equals: 0
  - id: restock
    title: Restock
    from: out-of-stock
    to: published
    action: restock
    by: [seller]
    variants: [physical]
    effects:
      - description: Stock is replenished
        field: stock
        equals: 10
  - id: auto-out-of-stock
    title: Sells out
    from: published
    to: out-of-stock
    action: stock-depleted
    by: [system]
    variants: [physical]
    effects:
      - description: Stock reaches zero
        field: stock
        equals: 0
