packages:
  - packages/*
  - apps/*
  - demo/*
  - workspace
  - examples/*
allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true
  koffi: false
# Security fixes for transitive deps that upstream hasn't picked up yet (Dependabot).
overrides:
  body-parser@>=2.0.0 <2.4.0: ^2.4.0
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  ip-address@<10.7.4: ^10.7.4
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  qs@>=6.7.0 <6.16.1: ^6.16.1
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
